allowBuilds:
  '@heroui/shared-utils': true
  electron: true
  electron-winstaller: true
  esbuild: true
  meta-json-schema: true

publicHoistPattern:
  - '*@heroui/*'

shamefullyHoist: true
virtualStoreDirMaxLength: 80
verifyDepsBeforeRun: false
patchedDependencies:
  vite-plugin-monaco-editor@1.1.0: patches/vite-plugin-monaco-editor@1.1.0.patch
overrides:
  # 跨站重定向时可能带上订阅的 Authorization 等凭据：
  # GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c（1.16.1）、GHSA-mrwp-f3q8-3g9p（1.16.2）
  follow-redirects: '>=1.16.2'
  # Sub-Store 前端本地服务（express）：GHSA-27r3-jxmh-p828 / GHSA-6pq8-jhm2-2vcw
  body-parser: '^2.4.0'
  qs: '^6.16.1'
  # 安装依赖时下载 Electron 用的工具，不进安装包：GHSA-2m5v-pch6-74hx 等 7.30.1 修复的问题
  '@electron/get>undici': '^7.30.1'
